<!DOCTYPE html>
<html>
<body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:20px;">
    <table role="presentation"
            style="
                margin:0 auto;
                background:#ffffff;
                border:1px solid #dddddd;
                padding: 0;
                border-spacing: 0;
            ">
        <tr>
            <td style="background:#2563eb;padding:20px;text-align:center;color:white;">
                <h1 style="margin:0;">Savings Banking System</h1>
            </td>
        </tr>

        <tr>
            <td style="padding:30px;">
                <h2>Verify your email address</h2>

                <p>Thank you for creating an account. Please verify your email address to activate your account.</p>

                <p style="text-align:center;">
                    <a href="{{ activate_url }}"
                       style="
                           background:#2563eb;
                           color:#ffffff;
                           text-decoration:none;
                           padding:12px 24px;
                           display:inline-block;
                       ">
                        Verify Email
                    </a>
                </p>

                <p>If the button doesn't work, use the link below:</p>

                <p>{{ activate_url }}</p>

                <p>If you did not create an account, you can ignore this email.</p>
            </td>
        </tr>
    </table>
</body>
</html>
